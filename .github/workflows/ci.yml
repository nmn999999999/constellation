name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC)
            os: ubuntu-latest
            compiler: g++
            exe_suffix: ""
          - name: Linux (Clang)
            os: ubuntu-latest
            compiler: clang++
            exe_suffix: ""
          - name: macOS (Clang)
            os: macos-latest
            compiler: clang++
            exe_suffix: ""
          - name: Windows (MSVC)
            os: windows-latest
            compiler: msvc
            exe_suffix: ".exe"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install cmake ninja

    - name: Set up MSVC environment
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure (Unix-like)
      if: runner.os != 'Windows'
      run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}

    - name: Configure (Windows MSVC)
      if: runner.os == 'Windows'
      run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Run unit tests
      shell: bash
      run: |
        # Single-config Ninja build puts executables directly in build/ on
        # every platform (including Windows with MSVC).
        test_dir="build"
        # Note: Windows-only tests (BMP rendering via <windows.h>) are only
        # built on Windows; portable tests run on every platform.
        for exe in "$test_dir"/*_test${{ matrix.exe_suffix }}; do
          if [ -f "$exe" ]; then
            echo "Running $exe"
            "$exe" || exit 1
          fi
        done

    - name: "Run video-frame decode test (no frames: skipped)"
      shell: bash
      run: |
        test_dir="build"
        if [ -f "$test_dir/test_video_decode${{ matrix.exe_suffix }}" ]; then
          "$test_dir/test_video_decode${{ matrix.exe_suffix }}" \
            || echo "test_video_decode skipped (no frame directory supplied)"
        fi

    - name: Upload decode_image artifact
      uses: actions/upload-artifact@v4
      with:
        name: decode_image-${{ matrix.os }}-${{ matrix.compiler }}
        path: |
          build/decode_image${{ matrix.exe_suffix }}
        retention-days: 7
        if-no-files-found: warn

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Check for TODO/FIXME (excluding third-party stb_image.h)
      run: |
        if grep -r "TODO\|FIXME\|XXX\|HACK" \
            --include="*.cpp" --include="*.h" . --exclude="stb_image.h"; then
          echo "Found TODO/FIXME markers in code"
          exit 1
        fi

    - name: Check for debug output
      run: |
        if grep -rn "std::cout.*debug\|std::cerr.*debug" --include="*.cpp" demo/ src/; then
          echo "Found debug output in code"
          exit 1
        fi
